<!--
  Thirty Seconds homepage, prototype 3 of 5: Open roles.

  Standalone file, same stack as the site, loaded from CDNs: React 18, Tailwind 3
  with the site's tokens and config, and Inter. Babel compiles the JSX in the
  browser so the component code reads like what would go in src/components/thirty.

  The run is simulated in the page at 2x speed. Nothing is sent anywhere.
  The header and footer are stand-ins for the real ones.
-->
<script>
  // Same rule as the site: a saved choice wins, else follow the OS. ?theme=light|dark forces one.
  (function () {
    var d = document.documentElement, p = null;
    try { p = localStorage.getItem("themePreference"); } catch (e) {}
    var q = new URLSearchParams(location.search).get("theme");
    if (q === "light" || q === "dark") p = q;
    var l = p === "light" || (p !== "dark" && window.matchMedia("(prefers-color-scheme: light)").matches);
    d.classList.toggle("light", l);
    d.style.colorScheme = l ? "light" : "dark";
  })();
</script>

<style>

<script type="text/babel" data-presets="react">
const PROTO_N = 3;

/* ==========================================================================
   Shared scaffolding: the same in all five prototypes
   ========================================================================== */
const { useState, useEffect, useRef, useCallback, useMemo } = React;

const cn = (...parts) => parts.filter(Boolean).join(" ");
const clamp01 = (v) => Math.max(0, Math.min(1, v));
const SITE = "https://www.davin.io";
const IN_FRAME = window.self !== window.top;
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const PROTOS = [
  { file: "01-inline.html", name: "Inline" },
  { file: "02-drafting-table.html", name: "Drafting table" },
  { file: "03-open-roles.html", name: "Open roles" },
  { file: "04-the-dial.html", name: "The dial" },
  { file: "05-constellation.html", name: "Constellation" },
];

/* ---------- Icons: the lucide shapes the site already uses ---------- */
function Svg({ className = "h-4 w-4", children }) {
  return (
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={cn("shrink-0", className)}
      aria-hidden="true"
    >
      {children}
    </svg>
  );
}
const I = {
  ArrowRight: (p) => <Svg {...p}><path d="M5 12h14" /><path d="m12 5 7 7-7 7" /></Svg>,
  ChevronLeft: (p) => <Svg {...p}><path d="m15 18-6-6 6-6" /></Svg>,
  ChevronRight: (p) => <Svg {...p}><path d="m9 18 6-6-6-6" /></Svg>,
  Check: (p) => <Svg {...p}><path d="M20 6 9 17l-5-5" /></Svg>,
  Circle: (p) => <Svg {...p}><circle cx="12" cy="12" r="10" /></Svg>,
  Loader: ({ className }) => <Svg className={cn("spin", className ?? "h-4 w-4")}><path d="M21 12a9 9 0 1 1-6.219-8.56" /></Svg>,
  Lock: (p) => <Svg {...p}><rect width="18" height="11" x="3" y="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></Svg>,
  UserCheck: (p) => <Svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="m16 11 2 2 4-4" /></Svg>,
  Rotate: (p) => <Svg {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Svg>,
  Menu: (p) => <Svg {...p}><path d="M4 6h16" /><path d="M4 12h16" /><path d="M4 18h16" /></Svg>,
  Moon: (p) => <Svg {...p}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></Svg>,
  Sun: (p) => (
    <Svg {...p}>
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
    </Svg>
  ),
};

/* ---------- Buttons: the site's cva variants as plain strings ---------- */
const BTN =
  "inline-flex cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-1 focus-visible:ring-ring disabled:pointer-events-none disabled:opacity-50";
const BTN_PRIMARY = "bg-primary text-primary-foreground shadow hover:bg-primary/90";
const BTN_GHOST = "hover:bg-accent hover:text-accent-foreground";
const BTN_OUTLINE = "border border-input bg-background text-foreground shadow-sm hover:bg-accent hover:text-accent-foreground";

/* ---------- The run contract, mirroring src/lib/thirty/events.ts ---------- */
const STEP_ORDER = ["validate", "read", "research", "design", "check"];

function stepLabel(id, host) {
  switch (id) {
    case "validate": return "Checking the address";
    case "read": return `Reading ${host}`;
    case "research": return "Working out what the company does";
    case "design": return "Designing the agent team";
    case "check": return "Checking the blueprint";
    default: return "Blueprint ready";
  }
}

function looksLikeWebsite(raw) {
  const s = raw.trim();
  if (!s || s.length > 2048) return false;
  return s.split(/\s+/).some((t) => /[^.\s]\.[^.\s]/.test(t));
}

function displayHost(raw) {
  let s = raw.trim().split(/\s+/).find((t) => t.includes(".")) ?? raw.trim();
  s = s.replace(/^[a-z][a-z0-9+.-]*:\/\//i, "").replace(/^[^@/]*@/, "");
  s = s.split(/[/?#:]/)[0] ?? s;
  return s.toLowerCase().replace(/^www\./, "").replace(/[.,;:!?)]+$/, "") || "your site";
}

function companyName(host) {
  const stem = host.split(".")[0] ?? host;
  return stem.split("-").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

const slugify = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

/* ---------- Simulated run: the mock stage output from src/lib/thirty/mock.ts ---------- */
const SPEED = 2; // simulated seconds per real second
const RUN_TOTAL_MS = 28600;
const STAGE_WINDOWS = {
  validate: [0, 900],
  read: [900, 6000],
  research: [6000, 11000],
  design: [11000, 26000],
  check: [26000, 28600],
};
const MOCK_AGENTS = ["Rush Quote Drafter", "ToolCrib Reorder Planner", "Renewal Risk Watcher", "Support Triage Desk"];

/** The same event shapes the API streams, each with the simulated time it arrives. */
function buildTimeline(host) {
  const name = companyName(host);
  const step = (at, id, status) => ({ at, t: "step", id, status });
  return [
    step(0, "validate", "start"),
    step(900, "validate", "done"),
    step(900, "read", "start"),
    { at: 1900, t: "page", path: "/", title: `${name} | Workshop tools for small manufacturers` },
    { at: 3100, t: "page", path: "/products", title: "Products" },
    { at: 4200, t: "page", path: "/pricing", title: "Pricing" },
    { at: 5200, t: "page", path: "/about", title: "About us" },
    step(6000, "read", "done"),
    step(6000, "research", "start"),
    { at: 9600, t: "company", name, oneLiner: "Sells workshop scheduling software and replacement tooling to small machine shops." },
    step(11000, "research", "done"),
    step(11000, "design", "start"),
    ...MOCK_AGENTS.map((agent, i) => ({ at: 14400 + i * 3400, t: "agent", name: agent })),
    step(26000, "design", "done"),
    step(26000, "check", "start"),
    step(RUN_TOTAL_MS, "check", "done"),
    { at: RUN_TOTAL_MS, t: "done" },
  ];
}

const IDLE_RUN = { phase: "idle", host: "", steps: [], agents: [], company: null, log: [], elapsedMs: 0 };

function applyEvent(state, ev) {
  const steps = state.steps.map((s) => ({ ...s, details: [...s.details] }));
  const find = (id) => steps.find((s) => s.id === id);
  const next = { ...state, steps, log: [...state.log, ev] };
  if (ev.t === "step") {
    const s = find(ev.id);
    if (ev.status === "start") {
      s.status = "active";
      s.startedAt = ev.at;
    } else {
      s.status = "done";
      s.ms = ev.at - s.startedAt;
    }
  } else if (ev.t === "page") {
    find("read").details.push(ev.title);
  } else if (ev.t === "company") {
    find("research").details.push(`${ev.name}: ${ev.oneLiner}`);
    next.company = { name: ev.name, oneLiner: ev.oneLiner };
  } else if (ev.t === "agent") {
    find("design").details.push(ev.name);
    next.agents = [...state.agents, { name: ev.name }];
  }
  return next;
}

/** phase is "idle", "running" or "done". The live page navigates to /b/<slug> on done. */
function useMockRun() {
  const [run, setRun] = useState(IDLE_RUN);
  const [error, setError] = useState(null);
  const timer = useRef(null);

  const stop = useCallback(() => {
    if (timer.current) clearInterval(timer.current);
    timer.current = null;
  }, []);
  useEffect(() => stop, [stop]);

  const start = useCallback(
    (raw) => {
      if (timer.current) return false;
      if (!looksLikeWebsite(raw)) {
        setError("That does not look like a website. Try something like yourcompany.com.");
        return false;
      }
      const host = displayHost(raw);
      const timeline = buildTimeline(host);
      const t0 = performance.now();
      let i = 0;
      setError(null);
      setRun({
        ...IDLE_RUN,
        phase: "running",
        host,
        steps: STEP_ORDER.map((id) => ({ id, label: stepLabel(id, host), status: "pending", details: [] })),
      });
      timer.current = setInterval(() => {
        const sim = Math.min((performance.now() - t0) * SPEED, RUN_TOTAL_MS);
        const due = [];
        while (i < timeline.length && timeline[i].at <= sim) due.push(timeline[i++]);
        const finished = i >= timeline.length;
        if (finished) stop();
        setRun((s) => {
          if (s.phase !== "running") return s;
          let n = s;
          for (const ev of due) n = applyEvent(n, ev);
          return { ...n, elapsedMs: sim, phase: finished ? "done" : "running" };
        });
      }, 50);
      return true;
    },
    [stop]
  );

  const reset = useCallback(() => {
    stop();
    setRun(IDLE_RUN);
    setError(null);
  }, [stop]);

  const activeStep = run.steps.find((s) => s.status === "active")?.id ?? null;
  const stageStep = run.phase === "done" ? "done" : run.phase === "running" ? activeStep ?? "validate" : "idle";
  return { ...run, error, start, reset, activeStep, stageStep, slug: slugify(run.host.split(".")[0] ?? "") };
}

/** Focus the field on load for mouse users, as the live page does. Skipped inside the gallery's previews. */
function useAutoFocus(ref) {
  useEffect(() => {
    if (IN_FRAME || !window.matchMedia("(pointer: fine)").matches) return;
    ref.current?.focus({ preventScroll: true });
  }, [ref]);
}

/* ---------- Page chrome: stand-ins for Header.tsx and Footer.tsx ---------- */
function Logo() {
  return (
    <svg viewBox="0 0 40 40" fill="none" className="h-10 w-10" aria-hidden="true">
      <rect width="40" height="40" rx="8" fill="var(--logo-tile)" />
      <path d="M10 14L4 20L10 26" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <path d="M30 14L36 20L30 26" stroke="#3b82f6" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <path
        d="M14 12V28M14 12H20.5C23.5376 12 26 14.9101 26 18.5V21.5C26 25.0899 23.5376 28 20.5 28H14"
        stroke="var(--logo-ink)"
        strokeWidth="2.5"
        strokeLinecap="round"
        strokeLinejoin="round"
      />
      <rect x="17" y="18" width="2" height="4" rx="0.5" fill="var(--logo-caret)" />
    </svg>
  );
}

function ThemeToggle() {
  const [light, setLight] = useState(() => document.documentElement.classList.contains("light"));
  const toggle = () => {
    const next = !light;
    const d = document.documentElement;
    d.classList.toggle("light", next);
    d.style.colorScheme = next ? "light" : "dark";
    try {
      localStorage.setItem("themePreference", next ? "light" : "dark");
    } catch (e) {}
    setLight(next);
  };
  return (
    <button
      type="button"
      onClick={toggle}
      aria-label={light ? "Switch to dark theme" : "Switch to light theme"}
      className={cn(BTN, BTN_GHOST, "h-9 w-9 text-muted-foreground")}
    >
      {light ? <I.Sun /> : <I.Moon />}
    </button>
  );
}

/** Prototype-only control: steps between the five options. Not part of any design. */
function ProtoSwitcher() {
  const prev = PROTOS[(PROTO_N + 3) % 5];
  const next = PROTOS[PROTO_N % 5];
  const link = "rounded-full p-1.5 transition-colors hover:text-foreground";
  return (
    <div className="flex items-center rounded-full border border-dashed border-border px-1 py-0.5 text-xs text-muted-foreground">
      <a href={prev.file} aria-label={`Previous prototype: ${prev.name}`} className={link}>
        <I.ChevronLeft className="h-3.5 w-3.5" />
      </a>
      <a href="index.html" className="px-1 transition-colors hover:text-foreground" title="All five prototypes">
        <span className="hidden sm:inline">Prototype </span>
        {PROTO_N}/5 · <span className="text-foreground">{PROTOS[PROTO_N - 1].name}</span>
      </a>
      <a href={next.file} aria-label={`Next prototype: ${next.name}`} className={link}>
        <I.ChevronRight className="h-3.5 w-3.5" />
      </a>
    </div>
  );
}

function Header() {
  const nav = [
    ["Work", "/work"],
    ["Portfolio", "/portfolio"],
    ["Experience", "/work#experience"],
    ["Book a Call", "/call"],
  ];
  return (
    <header className="fixed top-0 z-50 w-full border-b border-border bg-background/90 backdrop-blur-sm">
      <nav aria-label="Primary" className="container-narrow flex h-16 items-center justify-between gap-3">
        <a href={SITE} aria-label="Davin Harding, home" className="transition-opacity hover:opacity-80">
          <Logo />
        </a>
        <ProtoSwitcher />
        <div className="flex items-center gap-1">
          <div className="hidden items-center gap-1 lg:flex">
            {nav.map(([label, path]) => (
              <a key={label} href={SITE + path} className={cn(BTN, BTN_GHOST, "h-9 px-4 text-muted-foreground")}>
                {label}
              </a>
            ))}
          </div>
          <ThemeToggle />
          <span className={cn(BTN, "h-9 w-9 text-muted-foreground lg:hidden")} aria-hidden="true">

}

function Footer() {
  return (
    <footer className="border-t border-border bg-background">
      <div className="container-narrow flex items-center justify-between gap-4 py-3 md:py-4">
        <p className="text-sm text-muted-foreground">© {new Date().getFullYear()} Davin Harding</p>
        <p className="hidden text-xs text-muted-foreground sm:block">Prototype. The run is simulated at {SPEED}x speed.</p>
      </div>
    </footer>
  );
}

/** Header, one full-height stage, footer: the live page's fitViewport layout. */
function Shell({ step = "idle", glow = true, className, stageRef, children, ...rest }) {
  return (
    <div className="flex min-h-[100dvh] flex-col">
      <Header />
      <main id="main" className="flex flex-1 flex-col">
        <section
          ref={stageRef}
          data-step={step}
          aria-labelledby="home-title"
          className={cn("relative flex flex-1 flex-col bg-background", glow && "thirty-stage", className)}
          {...rest}
        >
          {children}
        </section>
      </main>
      <Footer />
    </div>

}

/* ---------- The live page's form, examples and run console ---------- */
const EXAMPLES = [
  { slug: "example-allbirds", name: "Allbirds", label: "direct-to-consumer apparel" },
  { slug: "example-linear", name: "Linear", label: "B2B software" },
  { slug: "example-sweetgreen", name: "sweetgreen", label: "multi-location restaurants" },
];

function UrlForm({ run, url, setUrl, inputRef, onFocus, onBlur }) {
  const own = useRef(null);
  const ref = inputRef ?? own;
  useAutoFocus(ref);
  const onSubmit = (e) => {
    e.preventDefault();
    if (!run.start(url)) ref.current?.focus();
  };
  return (
    <form noValidate onSubmit={onSubmit} className="w-full">
      <label htmlFor="blueprint-url" className="sr-only">
        Your company's website
      </label>
      <div className="flex flex-col gap-2 sm:flex-row">
        <input
          ref={ref}
          id="blueprint-url"
          name="url"
          type="text"
          inputMode="url"
          autoCapitalize="off"
          autoCorrect="off"
          autoComplete="off"
          spellCheck={false}
          enterKeyHint="go"
          maxLength={2048}
          placeholder="yourcompany.com"
          value={url}
          onChange={(e) => setUrl(e.target.value)}
          onFocus={onFocus}
          onBlur={onBlur}
          aria-invalid={run.error ? true : undefined}
          aria-describedby={run.error ? "blueprint-error" : "blueprint-help"}
          className={cn(
            "h-12 w-full min-w-0 rounded-md border bg-background/80 px-4 text-base text-foreground shadow-sm sm:flex-1",
            "placeholder:text-muted-foreground/70 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring",
            run.error ? "border-red-500/70" : "border-input"
          )}
        />
        <button type="submit" className={cn(BTN, BTN_PRIMARY, "h-12 px-6 text-base")}>
          Draft my blueprint
          <I.ArrowRight />
        </button>
      </div>
      {run.error ? (
        <p id="blueprint-error" role="alert" className="mt-3 rounded-md border border-red-500/40 bg-red-500/10 p-3 text-sm text-foreground">
          {run.error}
        </p>
      ) : null}
      <p id="blueprint-help" className="mt-3 text-sm text-muted-foreground">
        About 30 seconds. Reads your public site, nothing else.
      </p>
    </form>
  );
}

function ExampleLinks({ className }) {
  return (
    <div className={cn("text-sm", className)}>
      <p className="mb-2 text-muted-foreground">Or open one I ran earlier:</p>
      <ul className="flex flex-wrap gap-2" aria-label="Example blueprints">
        {EXAMPLES.map((ex) => (
          <li key={ex.slug}>
            <a
              href={`${SITE}/b/${ex.slug}`}
              target="_blank"
              rel="noopener"
              className="inline-flex items-baseline gap-1.5 rounded-md border border-border px-3 py-1.5 text-foreground/90 transition-colors hover:border-primary/50 hover:text-foreground"
            >
              <span className="font-medium">{ex.name}</span>
              <span className="text-xs text-muted-foreground">{ex.label}</span>
            </a>
          </li>
        ))}
      </ul>
    </div>
  );
}

function StepIcon({ status }) {
  if (status === "done") return <I.Check className="h-4 w-4 text-primary" />;
  if (status === "active") return <I.Loader className="h-4 w-4 text-primary" />;
  return <I.Circle className="h-4 w-4 text-muted-foreground/50" />;
}

/** What the prototype shows where the live page would navigate to the blueprint. */
function DoneRow({ run, className }) {
  return (
    <div className={cn("flex flex-wrap items-center justify-between gap-3", className)}>
      <p className="text-sm text-foreground" role="status">
        Blueprint ready. <span className="text-muted-foreground">The live page opens /b/{run.slug} here.</span>
      </p>
      <button type="button" onClick={run.reset} className={cn(BTN, BTN_OUTLINE, "h-8 px-3 text-xs")}>
        <I.Rotate className="h-3.5 w-3.5" />
        Run it again
      </button>
    </div>
  );
}

/** RunConsole.tsx as it ships today. */
function RunConsole({ run }) {
  const seconds = (run.elapsedMs / 1000).toFixed(1);
  return (
    <section aria-labelledby="run-console-title" className="w-full rounded-lg border border-border bg-card/80 p-4 text-left backdrop-blur-sm sm:p-5">
      <div className="mb-4 flex items-start justify-between gap-4">
        <div className="min-w-0">
          <h2 id="run-console-title" className="break-words text-base font-semibold text-foreground">
            Drafting a blueprint for {run.host}
          </h2>
          <p className="mt-1 text-xs text-muted-foreground">About 30 seconds. Reads your public site, nothing else.</p>
        </div>
        <p className="shrink-0 font-mono text-lg tabular-nums text-foreground">{seconds}s</p>
      </div>
      <ol aria-live="polite" className="space-y-2.5">
        {run.steps.map((step) => (
          <li key={step.id} className="flex gap-3">
            <span className="mt-0.5">
              <StepIcon status={step.status} />
            </span>
            <div className="min-w-0">
              <p className={cn("break-words text-sm", step.status === "pending" ? "text-muted-foreground" : "text-foreground")}>{step.label}</p>
              {step.details.length > 0 ? <p className="mt-0.5 truncate text-xs text-muted-foreground">{step.details.join(" · ")}</p> : null}
            </div>
          </li>
        ))}
      </ol>
      {run.phase === "done" ? (
        <DoneRow run={run} className="mt-4" />
      ) : (
        <div className="mt-3 flex min-h-9 items-center justify-end">
          <button type="button" onClick={run.reset} className={cn(BTN, BTN_GHOST, "h-8 px-3 text-xs")}>
            Cancel
          </button>
        </div>
      )}
    </section>
  );
}

/* ==========================================================================
   Prototype 3: Open roles
   ========================================================================== */
// Agent names and gates as they appear in the three committed example blueprints.
const SAMPLE_TEAMS = [
  {
    slug: "example-allbirds",
    company: "Allbirds",
    agents: [
      ["Return Reason Analyst", false],
      ["Return Eligibility Desk", true],
      ["Material Claims Checker", true],
      ["Holiday Markdown Watcher", true],
    ],
  },
  {
    slug: "example-linear",
    company: "Linear",
    agents: [
      ["Enterprise Security Review Drafter", true],
      ["Support Request Linker", true],
      ["Changelog Drafter", true],
      ["Business Plan Fit Scout", false],
    ],
  },
  {
    slug: "example-sweetgreen",
    company: "sweetgreen",
    agents: [
      ["Outpost Batch Planner", true],
      ["Catering Quote Desk", true],
      ["Allergen Guide Checker", true],
      ["New Location Demand Digest", false],
    ],
  },
];
const SLOTS = [0, 1, 2, 3];
const SHORT_STEP = { validate: "Check", read: "Read", research: "Research", design: "Design", check: "Review" };

function GateBadge() {
  return (
    <span
      className="org-chart__gate inline-flex h-5 w-5 items-center justify-center rounded-full border border-amber-500/70 bg-background text-amber-400 [.light_&]:text-amber-700"
      title="Needs human approval"
    >
      <I.Lock className="h-3 w-3" />
    </span>
  );
}

function Slot({ i, mode, team, run }) {
  if (mode === "sample") {
    const [name, gated] = team.agents[i];
    return (
      <li className="org-chart__agent">
        {gated ? <GateBadge /> : null}
        <a href={`${SITE}/b/${team.slug}`} target="_blank" rel="noopener" className="c3-slot group">
          <span key={team.slug} className="c3-swap block">
            <span className="block break-words text-sm font-medium text-foreground/75 transition-colors group-hover:text-foreground">{name}</span>
            <span className="mt-0.5 block text-xs text-muted-foreground">{gated ? "Human approval gate" : "Runs unattended"}</span>
          </span>
        </a>
      </li>
    );
  }
  const agent = run.agents[i];
  const drafting = mode === "run" && run.activeStep === "design" && i === run.agents.length;
  return (
    <li className="org-chart__agent">
      <div className={cn("c3-slot", agent && "c3-slot--filled", drafting && "c3-slot--drafting")}>
        <p className={cn("break-words text-sm font-medium", agent ? "text-foreground" : "text-muted-foreground")}>
          {agent ? agent.name : drafting ? "Drafting…" : "Open role"}
        </p>
        <p className="mt-0.5 text-xs text-muted-foreground">{agent ? "Drafted" : `Agent ${i + 1}`}</p>
      </div>
    </li>
  );
}

/** The run, as a five-part progress bar instead of a console. The chart below does the talking. */
function RunStrip({ run }) {
  const active = run.steps.find((s) => s.status === "active");
  const lastDetail = active?.details[active.details.length - 1];
  return (
    <section aria-labelledby="run-title" className="rounded-lg border border-border bg-card/80 p-4 backdrop-blur-sm sm:p-5">
      <div className="flex items-baseline justify-between gap-4">
        <h2 id="run-title" className="min-w-0 break-words text-base font-semibold text-foreground">
          Drafting a blueprint for {run.host}
        </h2>
        <p className="shrink-0 font-mono text-lg tabular-nums text-foreground">{(run.elapsedMs / 1000).toFixed(1)}s</p>
      </div>
      <ol className="mt-4 grid grid-cols-5 gap-1.5">
        {run.steps.map((step) => {
          const [a, b] = STAGE_WINDOWS[step.id];
          const fill = clamp01((run.elapsedMs - a) / (b - a));
          return (
            <li key={step.id}>
              <div className="h-1 overflow-hidden rounded-full bg-border">
                <div className="h-full rounded-full bg-primary" style={{ width: `${fill * 100}%` }} />
              </div>
              <p className={cn("mt-1.5 truncate text-xs", step.status === "pending" ? "text-muted-foreground/70" : "text-foreground")}>
                {SHORT_STEP[step.id]}
              </p>
            </li>
          );
        })}
      </ol>
      {run.phase === "done" ? (
        <DoneRow run={run} className="mt-3" />
      ) : (
        <div className="mt-2 flex min-h-8 items-center justify-between gap-3">
          <p aria-live="polite" className="min-w-0 truncate text-sm text-muted-foreground">
            <span className="text-foreground">{active?.label ?? "Starting"}</span>
            {lastDetail ? ` · ${lastDetail}` : ""}
          </p>
          <button type="button" onClick={run.reset} className={cn(BTN, BTN_GHOST, "h-8 shrink-0 px-3 text-xs")}>
            Cancel
          </button>
        </div>
      )}
    </section>
  );
}

function App() {
  const run = useMockRun();
  const [url, setUrl] = useState("");
  const [sample, setSample] = useState(0);
  const [pinned, setPinned] = useState(false);
  const [hovering, setHovering] = useState(false);

  const busy = run.phase !== "idle";
  const mode = busy ? "run" : url.trim() ? "yours" : "sample";
  const team = SAMPLE_TEAMS[sample];
  const host = busy ? run.host : looksLikeWebsite(url) ? displayHost(url) : null;

  // With nothing typed, the chart rotates through teams from earlier runs.
  useEffect(() => {
    if (mode !== "sample" || pinned || hovering || REDUCED_MOTION) return;
    const id = setInterval(() => setSample((i) => (i + 1) % SAMPLE_TEAMS.length), 4200);
    return () => clearInterval(id);
  }, [mode, pinned, hovering]);

  const topTitle = mode === "sample" ? team.company : host ?? "Your team";
  const topNote =
    mode === "sample" ? "A team I drafted earlier" : run.company ? run.company.oneLiner : "Approves every gated action";

  return (
    <Shell step={run.stageStep}>
      <div className="container-narrow w-full pb-8 pt-[max(6.5rem,calc(50dvh-19.5rem))]">
        <div className="mx-auto max-w-2xl md:text-center">
          <h1 id="home-title" className="thirty-hero mb-7 text-balance text-4xl font-semibold tracking-tight text-foreground md:text-5xl lg:text-6xl">
            Your next hire is an AI agent. Davin builds it.
          </h1>
          <div className="text-left">{busy ? <RunStrip run={run} /> : <UrlForm run={run} url={url} setUrl={setUrl} />}</div>
        </div>

        <div className="mx-auto mt-8 max-w-4xl" onMouseEnter={() => setHovering(true)} onMouseLeave={() => setHovering(false)}>
          <div className="mb-4 flex min-h-8 flex-wrap items-center justify-between gap-x-4 gap-y-2 text-sm">
            {mode === "sample" ? (
              <>
                <div className="flex items-center gap-1" role="group" aria-label="Sample teams">
                  <span className="mr-2 text-muted-foreground">Teams I drafted earlier:</span>
                  {SAMPLE_TEAMS.map((t, i) => (
                    <button
                      key={t.slug}
                      type="button"
                      aria-pressed={i === sample}
                      onClick={() => {
                        setSample(i);
                        setPinned(true);
                      }}
                      className={cn(
                        "rounded-md border px-2.5 py-1 transition-colors",
                        i === sample ? "border-primary/60 bg-primary/10 text-foreground" : "border-transparent text-muted-foreground hover:text-foreground"
                      )}
                    >
                      {t.company}
                    </button>
                  ))}
                </div>
                <a href={`${SITE}/b/${team.slug}`} target="_blank" rel="noopener" className="group inline-flex items-center gap-1 font-medium text-primary hover:underline">
                  Open the {team.company} blueprint
                  <I.ArrowRight className="h-4 w-4 transition-transform group-hover:translate-x-0.5" />
                </a>
              </>
            ) : mode === "yours" ? (
              <p className="text-muted-foreground">
                <span className="text-foreground">Four open roles{host ? ` at ${host}` : ""}.</span> Press Enter and my agents fill them.
              </p>
            ) : (
              <p className="text-muted-foreground">
                <span className="text-foreground">
                  {run.agents.length} of {SLOTS.length} roles filled
                </span>
                .
              </p>
            )}
          </div>

          <figure aria-label="Agent team">
            <div className="flex md:justify-center">
              <div className="rounded-lg border border-primary/50 bg-primary/10 px-4 py-2.5 text-sm md:max-w-md">
                <p className="flex items-center gap-2 font-medium text-foreground">
                  <I.UserCheck className="h-4 w-4 text-primary" />
                  <span key={topTitle} className="c3-swap break-all">{topTitle}</span>
                </p>
                <p key={topNote} className="c3-swap text-xs text-muted-foreground">{topNote}</p>
              </div>
            </div>
            <div className="org-chart__stem" aria-hidden="true" />
            <ol className="org-chart__agents mt-3 md:mt-0" style={{ "--org-cols": SLOTS.length }}>
              {SLOTS.map((i) => (
                <Slot key={i} i={i} mode={mode} team={team} run={run} />
              ))}
            </ol>
          </figure>
        </div>
      </div>
    </Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

// Reveal once the generated utility classes are in effect (or after three seconds regardless).
(function reveal(tries) {
  const shell = document.querySelector("#root > div");
  if ((shell && getComputedStyle(shell).display === "flex") || tries > 100) document.body.classList.add("ready");
  else setTimeout(() => reveal(tries + 1), 30);
})(0);
</script>
</body>
</html>
